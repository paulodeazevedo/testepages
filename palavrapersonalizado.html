<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo 3 em 1</title>
    <style>
        :root {
            --bg: #121214;
            --panel: #1f1f23;
            --panel-strong: #2c2c31;
            --text: #e6e6e6;
            --muted: #8b8b95;
            --correct: #538d4e;
            --present: #b59f3b;
            --absent: black;
            --border: #3a3a3c;
            --highlight: #5b84c4;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            background: radial-gradient(circle at top, #26262c 0%, #121214 55%);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .page {
            width: min(1100px, 100%);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 0 14px;
        }
        header {
            text-align: center;
            margin: 0 auto 4px;
            max-width: 760px;
        }
        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 2.4vw, 2.8rem);
            letter-spacing: 0.12em;
        }
        p.description {
            color: var(--muted);
            max-width: 780px;
            margin: 12px auto 0;
            line-height: 1.6;
        }
        .mode-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 10px;
            width: min(760px, 100%);
        }
        .mode-button,
        .mode-button.selected {
            border: none;
            border-radius: 999px;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: #3c82c7;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .mode-button:hover { transform: translateY(-1px); }
        .mode-button.selected {
            background: #5b84c4;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 18px 0 14px;
            width: min(720px, 100%);
        }
        button,
        .manual-button {
            border: none;
            border-radius: 999px;
            padding: 12px 18px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: #3c82c7;
            min-width: 120px;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        button:hover,
        .manual-button:hover { transform: translateY(-1px); }
        .manual-button { background: #4c618a; }
        .boards {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 12px;
            width: min(760px, 100%);
            margin: 0 auto;
            align-items: start;
        }
        .board {
            background: #1e1e24;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 280px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
            overflow: hidden;
        }
        .board.selected {
            border-color: rgba(91,132,196,0.8);
            box-shadow: 0 0 0 1px rgba(91,132,196,0.35);
        }
        .board-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .board-title {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .board-status {
            font-size: 0.95rem;
            color: var(--muted);
        }
        .grid {
            display: grid;
            gap: 8px;
            margin-top: 4px;
            grid-auto-rows: auto;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
        }
        .cell {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #18181d;
            border: 2px solid var(--border);
            display: grid;
            place-items: center;
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 10px;
            transition: transform 0.1s ease;
        }
        .cell.filled { border-color: #56565f; }
        .cell.correct { background: var(--correct); border-color: var(--correct); color: white; }
        .cell.present { background: var(--present); border-color: var(--present); color: white; }
        .cell.absent { background: var(--absent); border-color: var(--absent); color: white; }
        .board-footer {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.5;
            opacity: 0.88;
        }
        .keyboard {
            margin-top: 26px;
            display: grid;
            gap: 10px;
            justify-items: center;
            width: min(760px, 100%);
            margin-inline: auto;
        }
        .key-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 760px;
        }
        .key {
            flex: 1 1 36px;
            min-width: 32px;
            padding: 12px 10px;
            border-radius: 8px;
            border: none;
            background: var(--panel-strong);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.15s ease;
        }
        .key:hover { transform: translateY(-1px); }
        .key.wide { min-width: 66px; }
        .key.small {
            padding: 8px 12px;
            font-size: 0.85rem;
            background: #2b2b31;
        }
        .key.correct { background: var(--correct); color: white; }
        .key.present { background: var(--present); color: white; }
        .key.absent { background: var(--absent); color: white; }
        .message {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            color: #121212;
            padding: 12px 18px;
            border-radius: 999px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }
        .message.show { opacity: 1; }
        @media (max-width: 700px) {
            .boards { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
            .board {
                padding: 12px;
            }
            .board-header {
                flex-wrap: wrap;
                align-items: flex-start;
            }
            .board-title {
                font-size: 0.95rem;
            }
            .board-status {
                font-size: 0.85rem;
            }
            .grid {
                gap: 6px;
            }
            .row {
                gap: 5px;
            }
            .cell {
                font-size: 1.2rem;
                border-width: 1.5px;
                min-height: 40px;
            }
            .key-row {
                gap: 6px;
            }
            .key {
                min-width: 28px;
                padding: 10px 8px;
            }
            .key.wide {
                min-width: 54px;
            }
        }
        @media (max-width: 520px) {
            .keyboard {
                width: 100%;
            }
            .key-row {
                justify-content: space-between;
            }
            .key {
                flex: 1 1 28px;
            }
            .boards { grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 8px; }
            .board { padding: 10px; }
            .cell {
                font-size: 0.95rem;
                min-height: 34px;
            }
            .board-footer {
                font-size: 0.85rem;
            }
        }
        @media (max-width: 420px) {
            .boards { grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 8px; }
            .board { padding: 8px; }
            .grid { gap: 5px; }
            .row { gap: 4px; }
            .cell {
                font-size: 0.85rem;
                min-height: 28px;
            }
            .keyboard {
                width: 100%;
            }
            .key-row {
                justify-content: space-between;
                gap: 4px;
            }
            .key {
                min-width: 24px;
                padding: 8px 6px;
                font-size: 0.85rem;
            }
            .key.wide {
                min-width: 48px;
            }
        }
    </style>
</head>

            "lErio", "lesEm", "lOmis", "longA", "lOtur", "luEza", "mag.ª", "mAgis", "maEra", "maEsa", "maitE", "mAlus", "manoA", "margO", "mEier", "meleA", "menEs", "meolA", "mEvio", "midiA", "mirAs", "mEria", "mEsis", "mispA", "mOcis", "mojuE", "moOca", "moriA", "nAbis", "nAder", "nAjir", "nEgus", "nElio", "nEnax", "nEvio", "nEcia", "nEdia", "nErex", "nEsia", "nOnex", "nOvoa", "osEas", "ossAe", "pacuE", "pAder", "pAgs.", "pAnus", "pAris", "paruA", "paseA", "patAs", "pietA", "pEtis", "pExis", "privO", "ramAo", "rAtus", "rEgis", "robAo", "rOger", "rOnei", "sAvio", "sayAo", "sElia", "sElis", "siloE", "sErex", "sEvia", "sodrE", "sOfia", "sOnia", "sOter", "sutAo", "tAcio", "taipE", "taEsa", "tAnis", "tAnus", "tApua", "teerA", "telEm", "tEmis", "thomE", "tEfis", "tOfel", "tOmix", "tOnia", "uchOa", "Ulmer", "wElia", "zaEra", "zAnia", "zEnia", "zezAo"
        ];
        const KEY_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];

        const boards = [];
        let activeBoard = 0;
        let keyboardState = {};

        const boardsElement = document.getElementById('boards');
        const keyboardElement = document.getElementById('keyboard');
        const modeMenu = document.getElementById('modeMenu');
        const messageElement = document.getElementById('message');
        const newGameButton = document.getElementById('newGame');
        const manualWordsButton = document.getElementById('manualWords');

        function randomWord() {
            return VALID_WORDS[Math.floor(Math.random() * VALID_WORDS.length)].toUpperCase();
        }

        function showMessage(text) {
            messageElement.textContent = text;
            messageElement.classList.add('show');
            clearTimeout(messageElement.hideTimeout);
            messageElement.hideTimeout = setTimeout(() => messageElement.classList.remove('show'), 1800);
        }

        function createBoards() {
            boardsElement.innerHTML = '';
            boards.forEach((board, index) => {
                const section = document.createElement('section');
                section.className = 'board' + (index === activeBoard ? ' selected' : '');
                section.dataset.board = index;
                section.innerHTML = `
                    <div class="board-header">
                    </div>
                    <div class="grid" id="grid-${index}"></div>
                `;
                section.addEventListener('click', () => selectBoard(index));
                boardsElement.appendChild(section);
                renderBoard(index);
            });
        }

        function createModeButtons() {
            modeMenu.innerHTML = '';
            GAME_MODES.forEach((mode, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'mode-button' + (boardCount === mode.count ? ' selected' : '');
                button.textContent = mode.label;
                button.addEventListener('click', () => setMode(index));
                modeMenu.appendChild(button);
            });
        }

        function setMode(modeIndex) {
            if (modeIndex < 0 || modeIndex >= GAME_MODES.length) return;
            boardCount = GAME_MODES[modeIndex].count;
            activeBoard = 0;
            createModeButtons();
            resetBoards();
            selectBoard(0);
            showMessage(`Modo ${GAME_MODES[modeIndex].label} ativado`);
        }

        function resetBoards(targets) {
            if (!targets) {
                targets = Array.from({ length: boardCount }, () => randomWord());
            }
            boards.length = 0;
            sharedCurrent = '';
            for (let i = 0; i < boardCount; i += 1) {
                boards.push({
                    target: targets[i],
                    guesses: [],
                    current: '',
                    solved: false,
                    finished: false
                });
            }
            keyboardState = {};
            createBoards();
            createKeyboard();
            renderKeyboard();
        }

        function selectBoard(index) {
            if (index < 0 || index >= boards.length) return;
            activeBoard = index;
            document.querySelectorAll('.board').forEach((boardElement, boardIndex) => {
                boardElement.classList.toggle('selected', boardIndex === index);
            });
            updateStatusText(index);
        }

        function renderBoard(index) {
            const board = boards[index];
            const grid = document.getElementById(`grid-${index}`);
            if (!grid) return;
            grid.innerHTML = '';
            for (let row = 0; row < getMaxRows(); row += 1) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';
                const guess = board.guesses[row]?.word || '';
                const statuses = board.guesses[row]?.status || [];
                for (let col = 0; col < WORD_LENGTH; col += 1) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const isCurrentRow = row === board.guesses.length && !board.solved && !board.finished;
                    const letter = isCurrentRow ? sharedCurrent[col] || '' : guess[col] || '';
                    if (letter) cell.classList.add('filled');
                    cell.textContent = letter || '';
                    if (statuses[col]) cell.classList.add(statuses[col]);
                    rowEl.appendChild(cell);
                }
                grid.appendChild(rowEl);
            }
            updateStatusText(index);
        }

        function updateStatusText(index) {
            const board = boards[index];
            const status = document.getElementById(`status-${index}`);
            if (!status) return;
            if (board.solved) {
                status.textContent = 'Resolvido em ' + (board.guesses.length) + ' tentativa(s)';
            } else if (board.finished) {
                status.textContent = 'Acabou. Palavra: ' + board.target;
            } else {
                status.textContent = `Tentativa ${board.guesses.length + 1} de ${getMaxRows()}`;
            }
        }

        function createKeyboard() {
            keyboardElement.innerHTML = '';
            KEY_ROWS.forEach((row) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'key-row';
                row.split('').forEach((letter) => {
                    const key = document.createElement('button');
                    key.type = 'button';
                    key.className = 'key';
                    key.textContent = letter;
                    key.dataset.key = letter;
                    key.addEventListener('click', () => handleKey(letter));
                    rowEl.appendChild(key);
                });
                keyboardElement.appendChild(rowEl);
            });
            const bottom = document.createElement('div');
            bottom.className = 'key-row';
            const enter = document.createElement('button');
            enter.type = 'button';
            enter.className = 'key wide';
            enter.textContent = 'ENTRAR';
            enter.dataset.key = 'ENTER';
            enter.addEventListener('click', () => handleKey('ENTER'));
            const back = document.createElement('button');
            back.type = 'button';
            back.className = 'key wide';
            back.textContent = 'APAGAR';
            back.dataset.key = 'BACKSPACE';
            back.addEventListener('click', () => handleKey('BACKSPACE'));
            bottom.appendChild(enter);
            bottom.appendChild(back);
            keyboardElement.appendChild(bottom);
        }

        function renderKeyboard() {
            document.querySelectorAll('.key').forEach((key) => {
                const letter = key.dataset.key;
                if (!letter || letter === 'ENTER' || letter === 'BACKSPACE') return;
                const state = keyboardState[letter];
                key.classList.remove('correct', 'present', 'absent');
                if (state) key.classList.add(state);
            });
        }

        function updateKeyboardState(word, statuses) {
            statuses.forEach((status, index) => {
                const letter = word[index];
                const current = keyboardState[letter];
                if (current === 'correct') return;
                if (current === 'present' && status === 'absent') return;
                keyboardState[letter] = status;
            });
        }

        function getGuessStatus(guess, target) {
            const result = Array(WORD_LENGTH).fill('absent');
            const targetLetters = target.split('');
            guess.split('').forEach((letter, index) => {
                if (targetLetters[index] === letter) {
                    result[index] = 'correct';
                    targetLetters[index] = null;
                }
            });
            guess.split('').forEach((letter, index) => {
                if (result[index] !== 'correct') {
                    const position = targetLetters.indexOf(letter);
                    if (position !== -1) {
                        result[index] = 'present';
                        targetLetters[position] = null;
                    }
                }
            });
            return result;
        }

        function renderBoards() {
            boards.forEach((_, index) => renderBoard(index));
        }

        function handleKey(key) {
            if (boards.every((board) => board.solved || board.finished)) return;
            if (key === 'ENTER') {
                if (sharedCurrent.length !== WORD_LENGTH) {
                    showMessage('Digite 5 letras antes de enviar.');
                    return;
                }
                const guess = sharedCurrent;
                if (!VALID_WORDS.includes(guess.toLowerCase())) {
                    showMessage('Palavra nAo estA na lista vAlida.');
                    return;
                }
                let solvedCount = 0;
                boards.forEach((board) => {
                    if (board.solved || board.finished) return;
                    const status = getGuessStatus(guess, board.target);
                    board.guesses.push({ word: guess, status });
                    updateKeyboardState(guess, status);
                    if (guess === board.target) {
                        board.solved = true;
                        solvedCount += 1;
                    } else if (board.guesses.length >= getMaxRows()) {
                        board.finished = true;
                    }
                });
                sharedCurrent = '';
                renderBoards();
                renderKeyboard();
                if (solvedCount > 0) {
                    showMessage(`Acertou ${solvedCount} jogo(s)!`);
                } else {
                    showMessage('Palpite enviado para todos os jogos.');
                }
                return;
            }
            if (key === 'BACKSPACE') {
                sharedCurrent = sharedCurrent.slice(0, -1);
                renderBoards();
                return;
            }
            if (sharedCurrent.length >= WORD_LENGTH) return;
            let letter = key.toUpperCase();

                letter = letter
                .toUpperCase()
                .replace(/[ÁÀÂÃÄ]/g, 'A')
                .replace(/[ÉÈÊË]/g, 'E')
                .replace(/[ÍÌÎÏ]/g, 'I')
                .replace(/[ÓÒÔÕÖ]/g, 'O')
                .replace(/[ÚÙÛÜ]/g, 'U')
                .replace(/Ç/g, 'C')
                .split(/[,\s]+/)
                .filter(Boolean);


            if (!/^[A-Z]$/.test(letter)) return;
            sharedCurrent += letter;
            renderBoards();
        }

        function askManualWords() {
            const entry = prompt(`Digite ${boardCount} palavra(s) de ${WORD_LENGTH} letras separadas por vErgula ou espaCo:`);
            if (!entry) return;
            const words = entry
                .toUpperCase()
                .toUpperCase()
                .replace(/[ÁÀÂÃÄ]/g, 'A')
                .replace(/[ÉÈÊË]/g, 'E')
                .replace(/[ÍÌÎÏ]/g, 'I')
                .replace(/[ÓÒÔÕÖ]/g, 'O')
                .replace(/[ÚÙÛÜ]/g, 'U')
                .replace(/Ç/g, 'C')
                .split(/[,\s]+/)
                .filter(Boolean);
            if (words.length !== boardCount) {
                showMessage(`Informe exatamente ${boardCount} palavras de ${WORD_LENGTH} letras.`);
                return;
            }
            if (words.some((word) => word.length !== WORD_LENGTH || !/^[A-Z]+$/.test(word))) {
                showMessage(`Cada palavra deve ter ${WORD_LENGTH} letras sem nUmeros.`);
                return;
            }
            resetBoards(words);
            selectBoard(0);
            showMessage('Palavras definidas!');
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') event.preventDefault();
            if (event.key === 'Backspace') handleKey('BACKSPACE');
            if (event.key === 'Enter') handleKey('ENTER');
            const letter = event.key.toUpperCase();
            if (/^[A-Z]$/.test(letter)) handleKey(letter);
        });

        newGameButton.addEventListener('click', () => {
            resetBoards();
            selectBoard(0);
        });
        manualWordsButton.addEventListener('click', askManualWords);

        createModeButtons();
        resetBoards();
        selectBoard(0);
    </script>
